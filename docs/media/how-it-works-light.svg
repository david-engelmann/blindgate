<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-label="How blindgate works">
  <title>How blindgate works from input ingestion to deterministic verification verdict</title>
  <rect width="960" height="408" rx="20" fill="#faf8f5" stroke="#ded8ce" stroke-width="1.5"/>
  <text x="30" y="42" fill="#0284c7" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">ARCHITECTURE PIPELINE  /  BLINDGATE</text>
  <text x="30" y="72" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="750">What did the gate actually read?  <tspan fill="#57534e" font-size="15.5" font-weight="450">Syscall-level read-set reconstruction across forks, descriptors, symlinks, and exec boundaries.</tspan></text>
  
  <rect x="28" y="104" width="214" height="228" rx="14" fill="#ffffff" stroke="#ded8ce" stroke-width="1.5"/>
  <rect x="46" y="122" width="42" height="26" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="67" y="139.5" text-anchor="middle" fill="#0284c7" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">01</text>
  <text x="46" y="176" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">STRACE CAPTURE</text>
  <line x1="46" y1="190" x2="224" y2="190" stroke="#ded8ce" stroke-width="1"/>
  <text x="46" y="216" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="46" dy="0">Ingests offline strace -f</tspan><tspan x="46" dy="19">logs or runs a live</tspan><tspan x="46" dy="19">command under strace on</tspan><tspan x="46" dy="19">Linux</tspan></text><path d="M245 218 H255 M251 214 L255 218 L251 222" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="258" y="104" width="214" height="228" rx="14" fill="#ffffff" stroke="#ded8ce" stroke-width="1.5"/>
  <rect x="276" y="122" width="42" height="26" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="297" y="139.5" text-anchor="middle" fill="#0284c7" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">02</text>
  <text x="276" y="176" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">PROCESS FD TABLE</text>
  <line x1="276" y1="190" x2="454" y2="190" stroke="#ded8ce" stroke-width="1"/>
  <text x="276" y="216" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="276" dy="0">Tracks per-PID cwd, openat</tspan><tspan x="276" dy="19">dirfds, dup/fcntl flags,</tspan><tspan x="276" dy="19">clone shares, and</tspan><tspan x="276" dy="19">O_CLOEXEC</tspan></text><path d="M475 218 H485 M481 214 L485 218 L481 222" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="488" y="104" width="214" height="228" rx="14" fill="#ffffff" stroke="#ded8ce" stroke-width="1.5"/>
  <rect x="506" y="122" width="42" height="26" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="527" y="139.5" text-anchor="middle" fill="#0284c7" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">03</text>
  <text x="506" y="176" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">CANONICAL SCOPING</text>
  <line x1="506" y1="190" x2="684" y2="190" stroke="#ded8ce" stroke-width="1"/>
  <text x="506" y="216" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="506" dy="0">Scopes read opens against</tspan><tspan x="506" dy="19">--root and isolates</tspan><tspan x="506" dy="19">symlink escapes into</tspan><tspan x="506" dy="19">outside_reads</tspan></text><path d="M705 218 H715 M711 214 L715 218 L711 222" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="718" y="104" width="214" height="228" rx="14" fill="#ffffff" stroke="#ded8ce" stroke-width="1.5"/>
  <rect x="736" y="122" width="42" height="26" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="757" y="139.5" text-anchor="middle" fill="#0284c7" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">04</text>
  <text x="736" y="176" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">SURFACE VERDICT</text>
  <line x1="736" y1="190" x2="914" y2="190" stroke="#ded8ce" stroke-width="1"/>
  <text x="736" y="216" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="736" dy="0">Matches read_set against</tspan><tspan x="736" dy="19">claimed globs to convict</tspan><tspan x="736" dy="19">empty read set and</tspan><tspan x="736" dy="19">unproven checks</tspan></text>
  <rect x="28" y="350" width="904" height="38" rx="10" fill="#f1ede6" stroke="#ded8ce" stroke-width="1"/>
  <circle cx="48" cy="369" r="4.5" fill="#22c55e"/>
  <text x="62" y="373.5" fill="#57534e" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="11.5">Offline analysis on Linux and macOS  |  Pinned blindgate-evidence/1 format  |  Symlink-escape containment</text>
</svg>
