name: ci

on:
  push:
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and the test runner
        run: python -m pip install -e ".[dev]"
      - name: Run the local gate
        run: python -m pytest
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust port
        run: cargo build
      - name: Run the Rust port tests
        run: cargo test
      - name: Check the formatting
        run: cargo fmt --check
      - name: Run the linter
        run: cargo clippy --offline --all-targets
